services:
  - type: web
    name: TRAYadaptor
    runtime: python
    plan: starter
    numInstances: 2
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/tray
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TRAY_REFRESH_TOKEN
        sync: false
